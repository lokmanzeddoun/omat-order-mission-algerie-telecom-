name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d omat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omat_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/omat_test
      APP_PUBLIC_URL: http://localhost:5173
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: abcdef0123456789abcdef0123456789
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      AUTH_MFA_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema server/prisma/schema.prisma
      - run: npm run lint
      - run: npx tsc -p server/tsconfig.json --noEmit --incremental false
      - run: npm run build
      - run: npm test --workspace=server -- --runInBand
      - run: npm test --workspace=client
      - run: npm run test:e2e --workspace=server
      - run: npm audit --omit=dev --audit-level=high
