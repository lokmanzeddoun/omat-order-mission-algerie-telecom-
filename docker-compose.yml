services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omat}
      POSTGRES_USER: ${POSTGRES_USER:-omat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - omat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-omat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omat}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, frontend]
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "8443:8443"
    depends_on: [server]
    networks: [frontend]
    restart: unless-stopped

networks:
  backend: { internal: true }
  frontend: {}
volumes:
  omat-db: {}
